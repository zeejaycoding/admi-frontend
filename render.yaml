services:
  - type: web
    name: admi-client
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./build
    routes:
      # SPA fallback: serve index.html for every client-side route so
      # refreshing /admin/events, /admin/reports, etc. does not 404.
      # Static assets (e.g. /static/js/...) are NOT affected because Render
      # serves existing resources before applying rewrite rules.
      - type: rewrite
        source: /*
        destination: /index.html
